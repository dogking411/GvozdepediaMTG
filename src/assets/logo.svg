    <!-- лицо -->
    <circle cx="28.3" cy="28" r="3.3" fill="#fff" stroke-width="2"/>
    <circle cx="35.7" cy="28" r="3.3" fill="#fff" stroke-width="2"/>
    <circle cx="29" cy="28.6" r="1.5" fill="#123821" stroke="none"/>
    <circle cx="36.4" cy="28.6" r="1.5" fill="#123821" stroke="none"/>
