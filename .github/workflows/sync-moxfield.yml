name: Sync deck from Moxfield
run-name: Синхронизация колоды ${{ inputs.slug }}

# Запускается кнопкой «Синхронизировать» на странице колоды (через GitHub API)
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Адрес колоды (content/decks/<slug>.md)
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: moxfield-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Забрать колоду с Moxfield
        run: node scripts/sync-moxfield.mjs "$SLUG"
        env:
          SLUG: ${{ inputs.slug }}

      - name: Сохранить изменения
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Синхронизация с Moxfield: $SLUG"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
        env:
          SLUG: ${{ inputs.slug }}

  # Коммит от GITHUB_TOKEN не запускает другие workflow — публикуем сайт сами
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
