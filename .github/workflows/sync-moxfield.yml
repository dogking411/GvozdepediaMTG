name: Sync deck from Moxfield
run-name: Синхронизация колоды ${{ inputs.slug }}

# Запускается кнопкой «Синхронизировать» на странице колоды (через GitHub API).
# Колоду забирает компьютер редактора (self-hosted runner с меткой gvozdepedia):
# с серверов GitHub Moxfield запросы не пускает (403).
on:
  workflow_dispatch:
    inputs:
      slug:
        description: Адрес колоды (content/decks/<slug>.md)
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

# Пока компьютер выключен, в очереди ждёт только последний запуск
concurrency:
  group: moxfield-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: [self-hosted, gvozdepedia]
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      # Node, git и curl берутся с компьютера; скрипт сам коммитит и пушит,
      # так что шаг одинаково работает в PowerShell и bash
      - name: Забрать колоду с Moxfield и сохранить
        id: sync
        run: node scripts/sync-moxfield.mjs --commit
        env:
          SLUG: ${{ inputs.slug }}

  # Коммит от GITHUB_TOKEN не запускает другие workflow — публикуем сайт сами (на серверах GitHub)
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
